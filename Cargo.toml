[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
gpui-kit = { version = "0.8", default-features = false, features = ["assets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

flikk-core = { path = "crates/flikk-core" }
flikk-store = { path = "crates/flikk-store" }
flikk-media = { path = "crates/flikk-media" }
flikk-analysis = { path = "crates/flikk-analysis" }
flikk-cloud = { path = "crates/flikk-cloud" }
flikk-agent = { path = "crates/flikk-agent" }
flikk-deliver = { path = "crates/flikk-deliver" }
flikk-gpu = { path = "crates/flikk-gpu" }
flikk-html = { path = "crates/flikk-html" }
flikk-models = { path = "crates/flikk-models" }

# whisper.cpp is unusably slow as a CMake Debug build.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

# Decoding HTML frames (flikk-html) is several times slower unoptimized.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

# Cached frames (flikk's render cache) are QOI pictures, read during playback.
[profile.dev.package.qoi]
opt-level = 3
