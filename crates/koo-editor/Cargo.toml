[package]
name = "koo-editor"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
koo-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
koo-store.workspace = true
koo-media.workspace = true
koo-analysis.workspace = true
koo-cloud.workspace = true
koo-agent.workspace = true
koo-deliver.workspace = true
koo-gpu.workspace = true
koo-html.workspace = true
koo-models.workspace = true
cpal = "0.16"
image = { version = "0.25", default-features = false }
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
qoi = "0.4"

# Whisper on the GPU: Metal on macOS; Vulkan on Windows and Linux, for any
# vendor's GPU; without a GPU, or on Windows without Vulkan, the CPU. On
# macOS subject masks run on MLX, on the GPU too, and slow motion and depth
# on Core ML.
[target.'cfg(target_os = "macos")'.dependencies]
koo-models = { workspace = true, features = ["metal", "mlx", "coreml"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
koo-models = { workspace = true, features = ["vulkan"] }

# Slow motion and depth on any GPU: DirectML on Windows, WebGPU on Linux.
[target.'cfg(target_os = "windows")'.dependencies]
koo-models = { workspace = true, features = ["directml"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
koo-models = { workspace = true, features = ["webgpu"] }
