[package]
name = "flikk-analysis"
version.workspace = true
edition.workspace = true

[features]
default = ["whisper", "aligner", "diarizer", "sounds", "subjects", "interpolation", "people", "depth"]
# Local transcription with whisper.cpp; without it the transcript step is
# reported as unavailable and only voice activity and shot changes run.
whisper = ["flikk-models/whisper"]
# Word times from a forced-alignment model; without it word edges are
# measured on the audio levels alone.
aligner = ["flikk-models/aligner"]
# Speakers told apart by pyannote's segmentation model and WeSpeaker
# voiceprints; without it every word is "Speaker 1".
diarizer = ["flikk-models/diarizer"]
# Sounds, music and beats, and vectors for finding a sound by description;
# without it analysis stops at speech.
sounds = ["flikk-models/sounds"]
# Subject masks: objects picked by clicks, found and followed through
# video by SAM 2.1; without it subject masks keep nothing.
subjects = ["flikk-models/segment"]
# Optical flow slow motion: frames made between frames by RIFE; without it
# slowed clips are blended.
interpolation = ["flikk-models/interpolate"]
# Person masks: people cut out of their background by MODNet; without it
# person masks keep nothing.
people = ["flikk-models/matting"]
# Depth maps for the depth effects and masks, by Depth Anything V2 Small;
# without them depth effects leave the picture as it is.
depth = ["flikk-models/depth"]

[dependencies]
anyhow.workspace = true
flikk-core.workspace = true
flikk-models.workspace = true
serde.workspace = true
serde_json.workspace = true
